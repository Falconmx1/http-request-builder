name: HTTP Request Builder CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Test imports
      run: |
        python -c "
        import sys
        print(f'Python version: {sys.version}')
        try:
            import core
            import cli
            import utils
            print('✅ All modules imported successfully')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            sys.exit(1)
        "
    
    - name: Run simple test
      run: |
        python -c "
        from core.request import HTTPRequest
        from core.response import HTTPResponse
        print('✅ Core modules loaded')
        "
    
    - name: Run API health checks
      run: |
        python main.py --ci --ci-config examples/ci_config.json --report ci_report.html || echo "⚠️ Some checks failed, but continuing"
    
    - name: List reports
      run: |
        ls -la reports/ || echo "No reports directory yet"
        ls -la *.html || echo "No HTML files found"
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-report-python${{ matrix.python-version }}
        path: |
          reports/*.html
          *.html
          test_results.json
        retention-days: 30
        continue-on-error: true

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check status
      run: |
        echo "✅ Workflow completed"
        echo "📊 Check the artifacts for test reports"
