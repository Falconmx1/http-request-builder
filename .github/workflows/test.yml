name: HTTP Request Builder CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Verify installation
      run: |
        python -c "import core; import cli; import utils; print('✅ All modules imported successfully')"
        which http-request-builder || echo "Command not in PATH, using python -m"
    
    - name: Run unit tests
      run: |
        python -m unittest discover tests -v || echo "No tests found, skipping"
    
    - name: Run API health checks
      run: |
        python main.py --ci --ci-config examples/ci_config.json --report ci_report.html
      continue-on-error: true
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-report-python${{ matrix.python-version }}
        path: reports/*.html
        retention-days: 30
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-python${{ matrix.python-version }}
        path: test_results.json
        retention-days: 30

  notify:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    
    steps:
    - name: Check status
      run: |
        echo "✅ Workflow completed"
        echo "📊 Check the artifacts for test reports"
